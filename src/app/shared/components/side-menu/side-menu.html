<h2>Side Menu</h2>
<hr />

<h3 class="mt-3">Reactive</h3>
<ul class="list-group">
  @for (item of reactiveMenu; track item.route) {
    <li class="list-group-item" role="button" [routerLink]="item.route" routerLinkActive="active">
      {{ item.title }}
    </li>
  }
</ul>
