<h2>Reactives: Basics</h2>
<hr />

<div class="row">
  <div class="col">
    <form autocomplete="off">
      <!-- Field: Product -->
      <div class="mb-3 row">
        <label class="col-sm-3 col-form-label">Product</label>
        <div class="col-sm-9">
          <input type="text" class="form-control" placeholder="Product name" />

          <span class="form-text text-danger">
            <!-- Must be at least 3 characters -->
            error message
          </span>
        </div>
      </div>

      <!-- Field: Price -->
      <div class="mb-3 row">
        <label class="col-sm-3 col-form-label">Price</label>
        <div class="col-sm-9">
          <input type="number" class="form-control" placeholder="Product price" />
          <span class="form-text text-danger"> The price must be 0 or greater </span>
        </div>
      </div>

      <!-- Field: Stock -->
      <div class="mb-3 row">
        <label class="col-sm-3 col-form-label">Stock</label>
        <div class="col-sm-9">
          <input type="number" class="form-control" placeholder="Product stock" />

          <span class="form-text text-danger"> The stock must be 0 or greater </span>
        </div>
      </div>

      <div class="row">
        <div class="col">
          <button type="submit" class="btn btn-primary float-end">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

  <div class="col">

  </div>
</div>
